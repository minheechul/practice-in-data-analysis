<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Simulator</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

</head>

<body>

<div class="container mt-4">

    <h2>Simulator Title</h2>

    <div class="row">

        <!-- Left Control Panel -->
        <div class="col-md-3">

            <label class="form-label" for="var1">
                Variable 1
            </label>

            <input
                type="range"
                id="var1"
                class="form-range"
                min="0"
                max="100"
                value="50">

            <div id="var1Value">50</div>


            <label class="form-label mt-3" for="var2">
                Variable 2
            </label>

            <input
                type="range"
                id="var2"
                class="form-range"
                min="0"
                max="100"
                value="50">

            <div id="var2Value">50</div>

        </div>


        <!-- Right Graph Panel -->
        <div class="col-md-9">

            <div id="graph"></div>

            <h4 class="mt-3">
                Results
            </h4>

            <p id="result"></p>

        </div>

    </div>

</div>

<script>

// JavaScript

</script>

</body>

</html>
